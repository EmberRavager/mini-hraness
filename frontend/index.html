<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地对话 · Mini Harness</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #f7f9f8; color: #192e28; font: 16px/1.6 system-ui, sans-serif }
  main { max-width: 52rem; margin: auto; padding: clamp(16px, 4vw, 40px) }
  h1 { margin: 0 0 16px; font-size: 1.65rem }
  h2 { font-size: 1rem; margin: 0 0 6px }
  p, pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 }
  small, label { color: #4e635b }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px }
  input, textarea, button { font: inherit; border: 1px solid #a8b7b0; border-radius: 6px; padding: 8px 12px }
  input { width: 12rem; max-width: 100% }
  button { background: white; color: inherit; cursor: pointer }
  button:hover:enabled { border-color: #1a6550 }
  button:disabled { opacity: .5; cursor: default }
  .primary { background: #195d4a; color: white }
  section, #composer { margin-top: 18px; border-top: 1px solid #ccd6d1; padding-top: 12px }
  #history { max-height: 46vh; overflow: auto }
  article { padding: 8px 0 }
  article strong { font-size: .85rem; color: #24674f }
  textarea, pre { width: 100%; background: white; margin: 5px 0 }
  textarea { display: block; resize: vertical }
  pre { max-height: 18rem; overflow: auto; padding: 12px }
  #status { flex: 1; font-size: .9rem }
  #root, #files button { overflow-wrap: anywhere; max-width: 100% }
</style>
<main>
  <h1>本地对话</h1>
  <form id="spaces" class="row">
    <label for="space">工作区</label>
    <input id="space" list="choices" required pattern="[A-Za-z0-9_\-]+" title="请输入英文字母、数字、下划线或连字符" autocomplete="off">
    <datalist id="choices"></datalist>
    <button>切换</button><button type="button" id="fresh">新会话</button>
  </form>
  <small>工作目录为根目录 <code id="root">…</code> 下的专用工作区。启动服务时可指定根目录。</small>
  <section>
    <h2 id="heading">对话记录</h2>
    <div id="history" role="log"></div>
  </section>
  <section id="review" hidden>
    <h2>待审批的文件写入</h2><strong id="filename"></strong><pre id="preview"></pre>
    <div class="row"><button class="primary" id="allow">批准</button><button id="deny">拒绝</button></div>
  </section>
  <section id="downloads" hidden><h2>会话文件</h2><div id="files" class="row"></div></section>
  <form id="composer">
    <label for="message">消息</label>
    <textarea id="message" rows="3" placeholder="输入消息…" disabled></textarea>
    <div class="row"><span id="status" role="status">正在连接…</span><button class="primary" id="send" disabled>发送</button></div>
  </form>
</main>
<script>
  const $ = id => document.getElementById(id);
  const prefix = 'mini-harness:';
  let workspace, session, approval, busy = false, ready = false;

  function controls() {
    for (const el of $('spaces').elements) el.disabled = busy;
    $('message').disabled = busy || !ready || !!approval;
    $('send').disabled = $('message').disabled || !$('message').value.trim();
    $('allow').disabled = $('deny').disabled = busy || !ready;
  }

  async function run(action) {
    if (busy) return;
    busy = true;
    controls();
    $('status').textContent = '待处理…';
    try {
      await action();
    } catch (error) {
      ready = false;
      $('status').textContent = '出错（' + error.message + '）。可切换以重新载入，或开启新会话。';
    } finally {
      busy = false;
      controls();
    }
  }

  async function request(path, body) {
    const port = new URLSearchParams(location.search).get('apiPort') || '8765';
    if (!/^\d{1,5}$/.test(port)) throw new Error('API 端口无效');
    const res = await fetch('http://127.0.0.1:' + port + path, body && {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({workspace, session, ...body})
    });
    if (!res.ok) throw new Error((await res.json()).error || 'HTTP ' + res.status);
    return res.json();
  }

  function entry(role, value) {
    const row = document.createElement('article');
    const label = document.createElement('strong');
    const content = document.createElement('p');
    label.textContent = role;
    content.textContent = value;
    row.append(label, content);
    $('history').append(row);
    $('history').scrollTop = $('history').scrollHeight;
  }

  function assets(data) {
    approval = data.approval;
    $('review').hidden = !approval;
    $('filename').textContent = approval?.name || '';
    $('preview').textContent = approval?.text || '';
    $('files').replaceChildren();
    for (const [name, content] of Object.entries(data.files || {})) {
      const button = document.createElement('button');
      button.textContent = '下载 ' + name;
      button.onclick = () => {
        const link = document.createElement('a');
        const url = URL.createObjectURL(new Blob([content], {type: 'application/octet-stream'}));
        link.href = url;
        link.download = name || 'download';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      $('files').append(button);
    }
    $('downloads').hidden = !$('files').childElementCount;
  }

  function addChoice(name) {
    if (!Array.from($('choices').options).some(option => option.value === name))
      $('choices').append(new Option(name, name));
  }

  async function restore(name, fresh = false) {
    if (!/^[A-Za-z0-9_-]+$/.test(name)) throw new Error('工作区名称无效');
    workspace = $('space').value = name;
    const key = prefix + 'session:' + name;
    session = (!fresh && localStorage.getItem(key)) || crypto.randomUUID();
    localStorage.setItem(key, session);
    localStorage.setItem(prefix + 'workspace', name);
    $('heading').textContent = name + ' · 对话记录';
    $('history').replaceChildren();
    $('message').value = '';
    assets({});
    const data = await request('/session', {});
    for (const [user, assistant] of data.turns) {
      entry('你', user);
      entry('助手', assistant);
    }
    if (data.pendingMessage) entry('你', data.pendingMessage);
    assets(data);
    addChoice(name);
    ready = true;
    $('status').textContent = approval ? '待审批' : '就绪';
  }

  async function update(path, body) {
    const data = await request(path, body);
    if (data.reply) entry('助手', data.reply);
    assets(data);
    $('status').textContent = approval ? '待审批' : data.status || '就绪';
  }

  $('space').value = 'default';
  $('spaces').onsubmit = event => {
    event.preventDefault();
    run(() => restore($('space').value));
  };
  $('fresh').onclick = () => run(() => restore(workspace || 'default', true));
  $('message').oninput = controls;
  $('composer').onsubmit = event => {
    event.preventDefault();
    if ($('send').disabled) return;
    run(async () => {
      const message = $('message').value.trim();
      $('message').value = '';
      entry('你', message);
      await update('/chat', {message});
    });
  };
  for (const [id, allow] of [['allow', true], ['deny', false]]) {
    $(id).onclick = () => {
      if (approval && ready) run(() => update('/approve', {allow}));
    };
  }
  run(async () => {
    const info = await request('/info');
    $('root').textContent = info.root;
    info.workspaces.forEach(addChoice);
    await restore(localStorage.getItem(prefix + 'workspace') || 'default');
  });
</script>
</html>
